<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuoteDB</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1 class="logo">QuoteDB</h1>
            <div class="header-actions">
            <button id="random-quote-btn" class="random-quote-btn" aria-label="Random quote">&#9684; Random</button>
            <button id="add-quote-btn" class="add-quote-btn" aria-label="Add quote">+ Add quote</button>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
                <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
            </div>
        </div>
    </header>

    <div id="quote-modal" class="modal-backdrop" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="quote-modal-title">
            <div class="modal-header">
                <h2 id="quote-modal-title">Quote</h2>
                <button id="quote-modal-close" class="modal-close" aria-label="Close">&times;</button>
            </div>
            <div id="quote-modal-content" class="random-quote-content"></div>
            <div class="modal-footer" style="padding: 0 28px 28px;">
                <button id="quote-modal-copy" class="btn-secondary">Copy link</button>
                <button id="quote-modal-done" class="btn-primary">Done</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <div id="random-modal" class="modal-backdrop" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="random-modal-title">
            <div class="modal-header">
                <h2 id="random-modal-title">Random quote</h2>
                <button id="random-modal-close" class="modal-close" aria-label="Close">&times;</button>
            </div>
            <div id="random-quote-content" class="random-quote-content"></div>
            <div class="modal-footer" style="padding: 0 28px 28px;">
                <button id="random-again-btn" class="btn-secondary">Another one</button>
                <button id="random-modal-copy" class="btn-secondary" disabled>Copy link</button>
                <button id="random-modal-done" class="btn-primary">Done</button>
            </div>
        </div>
    </div>

    <div id="add-modal" class="modal-backdrop" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="modal-header">
                <h2 id="modal-title">Add quote</h2>
                <button id="modal-close" class="modal-close" aria-label="Close">&times;</button>
            </div>
            <form id="add-quote-form" class="modal-form">
                <label for="q-nick">Nick</label>
                <input type="text" id="q-nick" name="nick" placeholder="e.g. Samual" maxlength="100" required>
                <span class="char-counter" id="nick-counter">100 chars left</span>

                <label for="q-owner">Added by</label>
                <input type="text" id="q-owner" name="owner" placeholder="e.g. zykure" maxlength="100" required>
                <span class="char-counter" id="owner-counter">100 chars left</span>

                <label for="q-text">Quote</label>
                <textarea id="q-text" name="text" rows="5" placeholder="Quote text…" maxlength="2000" required></textarea>
                <span class="char-counter" id="text-counter">2000 chars left</span>

                <div id="add-error" class="form-error" hidden></div>

                <div class="modal-footer">
                    <button type="button" id="modal-cancel" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <main>
        <div class="container">
            <div class="search-section">
                <input type="text" id="search" class="search-input" placeholder="Search quotes..." maxlength="200">
            </div>

            <div id="results-info" class="results-info"></div>

            <div id="quotes-container" class="quotes-container"></div>

            <div id="pagination" class="pagination"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
